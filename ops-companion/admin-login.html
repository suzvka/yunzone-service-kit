<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理后台登录 · Admin Keybook v2.0</title>
<!--
  yunzone-service-kit 登录伴侣（零依赖单文件，协议见 docs/admin-keybook-protocol.md）

  用法（两种，推荐前者）：
  1. 放到服务静态目录（如 public/admin-login.html），经同源地址打开——
     会话 cookie 的同源读写不受第三方 cookie 限制；
  2. 本地双击打开并填写服务地址——跨源登录受浏览器第三方 cookie 政策约束，
     可能失败（页面会给出提示）。

  安全说明：私钥（PKCS8 PEM）仅在本页内存变量中驻留，不写入任何存储、
  不出现在网络请求里；网络上只传输本次 nonce 的 Ed25519 签名。
-->
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 640px;
         margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.25rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input[type=text] { width: 100%; padding: .45rem .6rem; margin-top: .3rem;
                     box-sizing: border-box; }
  input[type=file] { margin-top: .4rem; }
  button { margin-top: 1.25rem; padding: .55rem 1.4rem; cursor: pointer; }
  #status { margin-top: 1.25rem; padding: .6rem .8rem; border-radius: 6px;
            white-space: pre-wrap; word-break: break-all; display: none; }
  #status.ok { display: block; background: #e6f6e6; color: #145014; }
  #status.err { display: block; background: #fdeaea; color: #7a1c1c; }
  #status.info { display: block; background: #eef3fb; color: #1d3f6e; }
  #pubkey { font-family: ui-monospace, monospace; font-size: .85rem;
            word-break: break-all; }
  small.note { color: #666; }
  @media (prefers-color-scheme: dark) {
    #status.ok { background: #123212; color: #9fdd9f; }
    #status.err { background: #3a1414; color: #f2b0b0; }
    #status.info { background: #16283e; color: #a9c8ec; }
    small.note { color: #999; }
  }
</style>
</head>
<body>
<h1>管理后台登录（密码本 · v2.0）</h1>
<p><small class="note">本页没有密码输入框。登录 = 用本机私钥对服务器一次性
challenge 签名；私钥不出本机。请将本文件与私钥保存在同一台受控机器上。</small></p>

<div id="crypto-note"></div>

<label for="base">服务地址（Origin）
  <input type="text" id="base" placeholder="https://core.example.com" />
</label>

<label for="keyId">密码本条目 ID（key_id）
  <input type="text" id="keyId" placeholder="ops-laptop" />
</label>

<label for="keyfile">私钥文件（PKCS8 PEM，仅存内存、用完即弃）
  <input type="file" id="keyfile" accept=".pem,.key,.txt" />
</label>

<p>本机公钥指纹核对：<span id="pubkey">（选择私钥后显示）</span></p>

<button id="login" disabled>签名并登录</button>
<a id="goto" hidden>登录成功 → 前往管理后台</a>

<div id="status"></div>

<details style="margin-top:2rem">
  <summary><small class="note">为什么推荐把本页放到服务同源目录？</small></summary>
  <p><small class="note">会话 cookie 为 SameSite=Lax。跨源 fetch 登录时，
  浏览器第三方 cookie 政策可能拒绝存储 Set-Cookie，导致"登录成功但仍是 401"。
  同源部署（如 public/admin-login.html）无此问题。本地打开失败时请改用方式一。</small></p>
</details>

<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  const status = (text, kind) => {
    const el = $("status");
    el.textContent = text;
    el.className = kind;
  };

  // ── base64url（无 padding，协议 §3）──
  const bytesToB64url = (buf) =>
    btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
  const textToBytes = (s) => new TextEncoder().encode(s);

  // ── 运行时自检：WebCrypto Ed25519（Chrome 113+ / Firefox 97+ / Safari 17+）──
  async function selfTest() {
    const el = $("crypto-note");
    try {
      if (!crypto || !crypto.subtle) throw new Error("缺少 crypto.subtle（需 HTTPS 或 localhost 安全上下文）");
      const kp = await crypto.subtle.generateKey({ name: "ED25519" }, true, ["sign", "verify"]);
      const sig = await crypto.subtle.sign("ED25519", kp.privateKey, textToBytes("selftest"));
      const ok = await crypto.subtle.verify("ED25519", kp.publicKey, sig, textToBytes("selftest"));
      if (!ok) throw new Error("Ed25519 自测验签失败");
      el.innerHTML = "";
      return true;
    } catch (err) {
      el.innerHTML = '<p id="status" class="err">当前浏览器不支持 WebCrypto Ed25519：'
        + err.message + "（请升级浏览器，或改用支持的内核重试自检按钮）</p>";
      return false;
    }
  }

  // ── PEM → PKCS8 ArrayBuffer ──
  function pemToDer(pem) {
    const m = pem.match(/-----BEGIN PRIVATE KEY-----([\s\S]*?)-----END PRIVATE KEY-----/);
    if (!m) throw new Error("不是 PKCS8 PEM 私钥（需 BEGIN/END PRIVATE KEY 块，无加密）");
    const b64 = m[1].replaceAll(/[^A-Za-z0-9+/=]/g, "");
    const bin = atob(b64);
    const der = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) der[i] = bin.charCodeAt(i);
    return der;
  }

  let privateKey = null; // 仅内存持有；重新选择文件即覆盖

  async function onKeyFile(ev) {
    const file = ev.target.files[0];
    $("login").disabled = true;
    $("pubkey").textContent = "（选择私钥后显示）";
    if (!file) return;
    try {
      const der = pemToDer(await file.text());
      privateKey = await crypto.subtle.importKey(
        "pkcs8", der, { name: "ED25519" }, true, ["sign"]);
      // 导出公钥供运维与密码本 public_key 字段核对
      const pub = await derivePublicB64url(privateKey);
      $("pubkey").textContent = pub;
      $("login").disabled = false;
      status("私钥已载入内存。请核对上方公钥与密码本条目 public_key 一致。", "info");
    } catch (err) {
      privateKey = null;
      status("私钥载入失败：" + err.message, "err");
    }
  }

  // WebCrypto 无法从私钥直接导出公钥时的替代：用私钥 jwk 重导入带公钥的密钥对
  async function derivePublicB64url(priv) {
    const jwk = await crypto.subtle.exportKey("jwk", priv);
    delete jwk.d; delete jwk.dp; delete jwk.dq; delete jwk.qi; // 变公钥 jwk
    const pub = await crypto.subtle.importKey("jwk", jwk, { name: "ED25519" }, true, ["verify"]);
    const exportJwk = await crypto.subtle.exportKey("jwk", pub);
    return exportJwk.x;
  }

  // ── 登录：challenge → 本地签名 → POST ──
  async function login() {
    if (!privateKey) return;
    const base = new URL($("base").value.trim()); // 解析失败抛错 → catch 显示
    const keyId = $("keyId").value.trim();
    if (!keyId) { status("请填写 key_id（密码本条目 id）。", "err"); return; }
    const host = base.host;
    $("login").disabled = true;
    try {
      // 1. 领 challenge
      const challenge = await fetch(new URL("/api/ops/login/challenge", base), {
        credentials: "omit", cache: "no-store",
      }).then(async (r) => {
        if (r.status === 503) throw new Error("管理后台已禁用（ADMIN_KEYBOOK 未配置或密码本加载失败）");
        if (!r.ok) throw new Error("challenge 端点返回 HTTP " + r.status);
        return r.json();
      });

      // 2. 组装规范串并本地签名（协议 §3.2，逐字节与服务端一致）
      const ts = Math.floor(Date.now() / 1000);
      const message = `v2.${keyId}.${challenge.nonceB64}.${host}.${ts}`;
      const signature = bytesToB64url(
        await crypto.subtle.sign("ED25519", privateKey, textToBytes(message)));

      // 3. 提交登录（cookie 由服务端 Set-Cookie 下发）
      const res = await fetch(new URL("/api/ops/login", base), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ key_id: keyId, token: challenge.token, message, signature }),
        credentials: "include",
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok && (body.code === "OK" || body.ok === true || res.status === 204 || res.status === 200)) {
        const gotoEl = $("goto");
        gotoEl.href = new URL(body.redirect || "/admin", base).href;
        gotoEl.hidden = false;
        status("登录成功（会话主体：" + (body.username || keyId) + "）。若下方链接打开后仍未登录，"
          + "多半是第三方 cookie 政策拦截——请把本文件放到该服务同源目录后重试。", "ok");
      } else {
        status("登录失败：HTTP " + res.status + " " + (body.code || "") + " " + (body.message || ""),
          res.status === 401 && String(body.code).startsWith("CHALLENGE") ? "info" : "err");
      }
    } catch (err) {
      status("登录失败：" + err.message, "err");
    } finally {
      $("login").disabled = false;
    }
  }

  // ── 接线 ──
  if (location.protocol.startsWith("http")) $("base").value = location.origin;
  $("keyfile").addEventListener("change", onKeyFile);
  $("login").addEventListener("click", login);
  const recheck = document.createElement("button");
  recheck.textContent = "重新自检浏览器能力";
  recheck.addEventListener("click", selfTest);
  $("login").after(recheck);
  selfTest();
})();
</script>
</body>
</html>
